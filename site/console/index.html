<style>
/* Reference: Best Fitness OS / Twenty CRM. Light-first console: grouped sidebar, white cards, pills, worked-out numbers. */
:root{
  --bg:#f4f5f6; --panel:#ffffff; --panel2:#f7f8f9; --line:#e5e7ea; --fg:#17191e; --mut:#6b7078;
  --accent:#5d4fd6; --accent-ink:#ffffff;
  --good:#17804d; --goodbg:#e7f4ed; --warn:#8a6410; --warnbg:#f8f0db; --bad:#b3362c; --badbg:#f9e9e7; --info:#2b6cb0; --infobg:#e8f0f9;
  --chipbg:#eef0f2;
  --c1:#b3722c; --c2:#2b6cb0; --c3:#17804d; --c4:#5d4fd6; --c5:#b3362c; --c6:#007fa3;
  --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --panel:#1b1d21; --panel2:#212329; --line:#2c2f36; --fg:#e8e9ec; --mut:#9a9fab;
    --accent:#9d8cff; --accent-ink:#17122e;
    --good:#4fc08d; --goodbg:#18302a; --warn:#e6b450; --warnbg:#332a16; --bad:#e2695e; --badbg:#36201e; --info:#6aa9e9; --infobg:#1b2836;
    --chipbg:#24262c;
    --c1:#c77c3f; --c2:#4a8ccd; --c3:#36a476; --c4:#8f7df0; --c5:#e2695e; --c6:#1b9fc0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --panel:#1b1d21; --panel2:#212329; --line:#2c2f36; --fg:#e8e9ec; --mut:#9a9fab;
  --accent:#9d8cff; --accent-ink:#17122e;
  --good:#4fc08d; --goodbg:#18302a; --warn:#e6b450; --warnbg:#332a16; --bad:#e2695e; --badbg:#36201e; --info:#6aa9e9; --infobg:#1b2836;
  --chipbg:#24262c;
  --c1:#c77c3f; --c2:#4a8ccd; --c3:#36a476; --c4:#8f7df0; --c5:#e2695e; --c6:#1b9fc0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;font-size:13.5px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:11px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.brand .dot{width:24px;height:24px;border-radius:7px;background:var(--accent);display:inline-block}
.brand small{font-weight:500;color:var(--mut);font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;margin-left:2px}
.demo-badge{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--warn);background:var(--warnbg);border-radius:999px;padding:4px 11px;white-space:nowrap;font-weight:600}
.spacer{flex:1}
#search{font:inherit;font-size:13px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:min(260px,100%)}
#searchwrap{position:relative}
#searchdrop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:30;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#searchdrop[hidden]{display:none!important}
#searchdrop button{display:block;width:100%;text-align:left;appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-size:12.5px;padding:8px 12px;cursor:pointer}
#searchdrop button:hover{background:var(--panel2)}
#searchdrop .m{color:var(--mut);font-size:11px}
select.loc{font:inherit;font-size:12.5px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);white-space:nowrap}
.me .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.layout{display:grid;grid-template-columns:196px 1fr;gap:24px;padding-block:14px 0}
nav.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:2px}
nav.side .grp{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);padding:13px 10px 4px;font-weight:600}
nav.side .grp:first-child{padding-top:2px}
nav.side a{display:block;color:var(--fg);font-size:13px;padding:7px 10px;border-radius:8px}
nav.side a:hover{background:var(--panel);text-decoration:none}
nav.side a.on{background:var(--panel);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
main{min-width:0}
h2{font-family:var(--display);font-size:17px;margin:0 0 3px;font-weight:700}
h3{font-family:var(--display);font-size:14px;margin:0 0 2px;font-weight:700}
.crumb{color:var(--mut);font-size:12px;margin-bottom:10px}
.crumb a{color:var(--mut)}
.panel-sub{color:var(--mut);font-size:12px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-width:0}
.tile .k{font-size:11px;color:var(--mut)}
.tile .v{font-family:var(--display);font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tile .s{font-size:11px;color:var(--mut);margin-top:3px}
.tile .s.good{color:var(--good)} .tile .s.bad{color:var(--bad)}
section.block{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;min-width:0}
.cols2{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.cols2 > *{min-width:0}
@media (max-width:980px){ .cols2{grid-template-columns:1fr} }
.rowlist{display:flex;flex-direction:column}
.rowlist>*{padding:10px 0;border-top:1px solid var(--line)}
.rowlist>*:first-child{border-top:0}
.r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-width:0}
.r .grow{flex:1 1 220px;min-width:0}
.r .ttl{font-weight:600;font-size:13px}
.r .sub{color:var(--mut);font-size:12px;margin-top:1px}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:12.5px}
.chip{display:inline-block;font-size:10.5px;border-radius:999px;padding:2.5px 9px;background:var(--chipbg);color:var(--mut);white-space:nowrap;font-weight:600}
.chip.good{color:var(--good);background:var(--goodbg)}
.chip.warn{color:var(--warn);background:var(--warnbg)}
.chip.bad{color:var(--bad);background:var(--badbg)}
.chip.info{color:var(--info);background:var(--infobg)}
.chip.acc{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
button.act{appearance:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.act:hover{border-color:var(--fg)}
button.act.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.act.ghostbad{color:var(--mut)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel);margin-bottom:12px;flex-wrap:wrap;position:relative;isolation:isolate}
.seg .thumb{position:absolute;top:0;bottom:0;background:var(--chipbg);z-index:0;transition:left .3s cubic-bezier(.2,.9,.25,1),width .38s cubic-bezier(.2,.9,.25,1)}
@media (prefers-reduced-motion:reduce){.seg .thumb{transition:none}}
.seg button{appearance:none;border:0;background:transparent;color:var(--mut);font:inherit;font-size:12.5px;padding:7px 13px;cursor:pointer;white-space:nowrap;position:relative;z-index:1}
.seg button[aria-pressed="true"]{color:var(--fg);font-weight:600}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl tr.click{cursor:pointer}
table.tbl tr.click:hover td{background:var(--panel2)}
.tscroll{overflow-x:auto}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* charts */
.chart{margin-top:8px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11.5px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
#tip{position:fixed;z-index:60;background:var(--fg);color:var(--bg);font-size:11.5px;padding:5px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
#tip[hidden]{display:none!important}
/* kanban */
.board{display:flex;gap:10px;overflow-x:auto;padding-block:4px 6px;align-items:flex-start}
.col{flex:0 0 232px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
.col .head{display:flex;align-items:center;gap:7px;padding:2px 4px 9px;font-size:12px}
.col .head b{font-size:12.5px}
.col .head .n{color:var(--mut)}
.col .head .sum{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11px}
.sdot{width:8px;height:8px;border-radius:3px;flex:none}
.cards{display:flex;flex-direction:column;gap:8px}
.cardk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cardk .who{font-weight:600;font-size:13px}
.cardk .sub{color:var(--mut);font-size:11.5px;margin-top:2px}
.cardk .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.cardk .next{font-size:11.5px;color:var(--mut);margin-top:7px;border-top:1px solid var(--line);padding-top:6px}
/* agent jobs */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:10px}
.job{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;flex-direction:column;gap:7px}
.job .head{display:flex;align-items:center;gap:8px}
.job .head b{font-size:13px;flex:1;min-width:0}
.tog{width:30px;height:18px;border-radius:999px;background:var(--good);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.job .what{font-size:12px;color:var(--mut)}
.job .before{font-size:11.5px;color:var(--mut)}
.job .before b{color:var(--fg)}
.job .stats{display:flex;gap:14px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.job .stats .k{font-size:10px;color:var(--mut)}
.job .stats .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px;font-family:var(--display)}
.rec{font-size:12px;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--mut)}
.rec b{color:var(--fg)}
.q-count{font-family:var(--display);font-weight:700;color:var(--accent)}
.decided-time{font-size:11px;color:var(--mut);white-space:nowrap}
/* patient profile */
.banner{background:var(--badbg);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:11px;padding:12px 15px;margin-bottom:14px}
.banner .r{align-items:center}
.banner b.amt{font-family:var(--display);font-size:16px}
.facts{display:flex;flex-direction:column}
.facts>div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.facts>div:first-child{border-top:0}
.facts .k{color:var(--mut)}
.facts .v{text-align:right;min-width:0;font-weight:500}
.toggle{width:34px;height:20px;border-radius:999px;background:var(--chipbg);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;appearance:none}
.toggle:checked{background:var(--good)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .12s}
.toggle:checked::after{left:16px}
.strip{display:flex;gap:2px;align-items:flex-end;height:46px;margin-top:6px}
.strip i{flex:1;background:var(--c3);border-radius:2px 2px 0 0;min-width:2px}
.empty{color:var(--mut);font-size:13px;padding:12px 0;font-style:italic}
.srcline{color:var(--mut);font-size:11px;margin-top:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);font-size:12.5px;padding:9px 16px;border-radius:9px;z-index:70;font-weight:600}
#toast[hidden]{display:none!important}
/* ringing */
.ringing{border:1px solid var(--accent);border-radius:11px;padding:12px 14px;margin-bottom:12px;background:color-mix(in srgb,var(--accent) 6%,transparent)}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:7px;animation:pul 1s infinite}
@keyframes pul{50%{opacity:.25}}
.ringing .tline{font-size:12.5px;margin-top:7px;color:var(--mut)}
.ringing .tline b{color:var(--fg)}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.meta{font-size:11.5px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.callrow{border-top:1px solid var(--line)}
.callrow:first-child{border-top:0}
.callrow summary{list-style:none;cursor:pointer;padding:10px 0}
.callrow summary::-webkit-details-marker{display:none}
.transcript{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;margin:2px 0 12px;font-size:12.5px;color:var(--mut)}
.transcript b{color:var(--fg)}
footer{color:var(--mut);font-size:11.5px;padding-block:16px 8px;border-top:1px solid var(--line);margin-top:6px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr;gap:8px}
  nav.side{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px;gap:6px;align-items:center}
  nav.side .grp{display:none}
  nav.side a{white-space:nowrap}
}
/* campaign builder */
.rule{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.rule:first-child{border-top:0}
.rule .pillbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea.aud{font:inherit;font-size:13px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-height:58px;resize:vertical}
.excl{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--mut)}
.excl b{color:var(--fg)}
</style>

var __segFrom=null;
